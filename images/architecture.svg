<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do BinLab</title>
  <desc id="desc">Interfaces CLI e GUI usam o domínio de conversão, operações e análise; um serviço de arquivos gera relatórios estáticos.</desc>
  <defs>
    <style>
      .bg{fill:#101b35}.box{fill:#172d52;stroke:#49e3c1;stroke-width:2}.txt{fill:#f5f8ff;font:600 20px system-ui,sans-serif}.sub{fill:#b5c5df;font:15px system-ui,sans-serif}.line{stroke:#62a8ff;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#62a8ff"/></marker>
  </defs>
  <rect width="960" height="420" rx="24" class="bg"/>
  <rect x="40" y="158" width="190" height="100" rx="16" class="box"/>
  <text x="135" y="199" text-anchor="middle" class="txt">CLI / GUI</text>
  <text x="135" y="229" text-anchor="middle" class="sub">adaptadores de interface</text>
  <path d="M230 208h55" class="line"/>
  <rect x="300" y="35" width="270" height="85" rx="14" class="box"/>
  <text x="435" y="72" text-anchor="middle" class="txt">Domínio numérico</text>
  <text x="435" y="98" text-anchor="middle" class="sub">bases · aritmética · lógica</text>
  <rect x="300" y="168" width="270" height="85" rx="14" class="box"/>
  <text x="435" y="205" text-anchor="middle" class="txt">Análise de bits</text>
  <text x="435" y="231" text-anchor="middle" class="sub">largura · sinal · bytes</text>
  <rect x="300" y="301" width="270" height="85" rx="14" class="box"/>
  <text x="435" y="338" text-anchor="middle" class="txt">Serviço de artefatos</text>
  <text x="435" y="364" text-anchor="middle" class="sub">fontes · hex · binários</text>
  <path d="M285 208V77h15M285 208h15M285 208v135h15" class="line"/>
  <path d="M570 77h55M570 210h55M570 343h55" class="line"/>
  <rect x="640" y="35" width="275" height="85" rx="14" class="box"/>
  <text x="777" y="72" text-anchor="middle" class="txt">Python standard library</text>
  <text x="777" y="98" text-anchor="middle" class="sub">sem dependências de runtime</text>
  <rect x="640" y="168" width="275" height="85" rx="14" class="box"/>
  <text x="777" y="205" text-anchor="middle" class="txt">objdump opcional</text>
  <text x="777" y="231" text-anchor="middle" class="sub">desassemblagem estática</text>
  <rect x="640" y="301" width="275" height="85" rx="14" class="box"/>
  <text x="777" y="338" text-anchor="middle" class="txt">Relatório reutilizável</text>
  <text x="777" y="364" text-anchor="middle" class="sub">formatado por cada interface</text>
</svg>
