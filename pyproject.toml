[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binlab"
description = "Calculadora didática e leitor estático de dados binários, hexadecimais, C e assembly"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "BinLab contributors" }]
keywords = ["binary", "hexadecimal", "assembly", "C", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Utilities",
]
dynamic = ["version"]

[project.scripts]
binlab = "binlab.cli:main"
binlab-gui = "binlab.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "binlab.__version__" }
