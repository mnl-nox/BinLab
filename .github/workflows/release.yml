name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Verify package import
        run: python -c "import binlab; print(binlab.__version__)"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify release tag
        run: |
          package_version="$(python -c 'import binlab; print(binlab.__version__)')"
          if [ "v${package_version}" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v${package_version}."
            exit 1
          fi
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
