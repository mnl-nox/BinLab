name: Build and publish Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Validate, package and publish Linux release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package, tests and packager
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ".[test]" "pyinstaller==6.16.0"
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install --no-document fpm
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Verify package import
        run: python -c "import binlab; print(binlab.__version__)"
      - name: Run unit and property-based tests
        run: python -m unittest discover -s tests -v
      - name: Verify release tag
        run: |
          package_version="$(python -c 'import binlab; print(binlab.__version__)')"
          if [ "v${package_version}" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v${package_version}."
            exit 1
          fi
      - name: Build source and wheel distributions
        run: python -m build
      - name: Build Linux packages
        run: bash packaging/build-linux.sh
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
