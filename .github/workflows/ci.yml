name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "stage/**"
      - "architecture/**"

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip build
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Check package metadata and import
        run: python -c "import binlab; print(binlab.__version__)"
      - name: Run unit and property-based tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build

  web:
    name: Web quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Run Web domain tests
        working-directory: apps/web
        run: npm test
      - name: Build Web application
        working-directory: apps/web
        run: npm run build

  linux-packages:
    name: Linux package smoke build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pyinstaller==6.16.0"
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm desktop-file-utils
          sudo gem install --no-document fpm
      - name: Build Linux packages
        run: |
          desktop-file-validate packaging/linux/binlab.desktop
          bash packaging/build-linux.sh
      - name: Inspect package manifests
        run: |
          dpkg-deb --contents dist/*.deb
          rpm -qpl dist/*.rpm
          tar -tzf dist/*.tar.gz
      - name: Install Debian package and smoke-test CLI/GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          sudo apt-get install -y ./dist/*.deb
          expected_version="v$(python -c 'import binlab; print(binlab.__version__)')"
          printf '0\n' | /usr/bin/binlab | grep -F "$expected_version"
          set +e
          xvfb-run -a timeout 8s /usr/bin/binlab-gui
          gui_status=$?
          set -e
          if [ "$gui_status" -ne 124 ]; then
            echo "GUI smoke test failed or exited unexpectedly (status=$gui_status)." >&2
            exit 1
          fi
      - name: Upload Linux packages for direct testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: binlab-linux-x86_64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
