name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "stage/**"
      - "architecture/**"

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip build
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Check package metadata and import
        run: python -c "import binlab; print(binlab.__version__)"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build

  web:
    name: Web quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Run Web domain tests
        working-directory: apps/web
        run: npm test
      - name: Build Web application
        working-directory: apps/web
        run: npm run build
